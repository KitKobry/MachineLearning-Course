
dataset:
  source: openml
  name: adult
  version: 2
  expected_rows: 48842
  expected_columns: 15
  target_column: class

split:
  test_size: 0.30
  stratify: true
  random_state: 42

missing_values:
  categorical_strategy: most_frequent
  numeric_strategy: median
  question_mark_means_missing: true

outliers:
  method: percentile_clipping
  lower_percentile: 1
  upper_percentile: 99
  fit_on: train_only

duplicates:
  remove_from: train_only
  keep: first

feature_engineering:
  - capital_net
  - hours_per_age

model:
  name: LogisticRegression
  max_iter: 1000
  random_state: 42

metrics:
  - accuracy
  - f1

reproducibility:
  random_state: 42
  hash_algorithm: SHA256
