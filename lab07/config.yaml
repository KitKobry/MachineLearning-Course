seed: 42
device: cpu
data:
  batch_size: 128
  num_workers: 0
  validation_fraction: 0.1
training:
  epochs: 8
  learning_rate: 0.001
  weight_decay: 0.0001
  fine_tune_epochs: 3
  latency_warmup: 20
  latency_iterations: 100
model:
  baseline_channels: [32, 64, 128]
  baseline_hidden: 512
  student_channels: [16, 32, 48]
  student_hidden: 128
pruning:
  sparsity_targets: [0.0, 0.25, 0.5, 0.75, 0.9, 0.95]
  structured_targets: [0.10, 0.25, 0.50]
distillation:
  temperature: 4.0
  alpha: 0.5
  epochs: 8
  learning_rate: 0.001
energy:
  assumed_cpu_power_watts: 35.0
